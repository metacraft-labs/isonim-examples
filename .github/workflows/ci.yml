name: CI

# Every job here compiles against sibling repositories that are NOT part of
# this checkout: `config.nims` carries a `--path:$config/../<repo>/...` switch
# for each entry in `.github/sibling-repos`. A bare `actions/checkout@v4` put
# none of them on disk, so `nim check` / `nim c` resolved no cross-repo import
# and every recipe failed -- silently, because the recipes pipe into `tee` and
# just's default shell has no pipefail (fixed separately in the Justfile).
#
# Siblings are cloned by `setup-dev-env`, which delegates to `clone-siblings`
# and resolves each name in `.github/sibling-repos` against the per-commit
# workspace lock in the manifest repo. That is the single approved sibling
# revision source (codetracer-specs/Testing/Cross-Repo-CI-Integration.md); a
# second hand-pinned `actions/checkout` would be another place for revisions to
# drift away from what the workspace actually builds.

on:
  push:
    branches: [main, dev, stable]
  pull_request:

jobs:
  lint:
    name: Lint (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just lint
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 30

  test:
    name: Test (orc/release/threads:on) (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.runner }}
          path: test-logs/
          retention-days: 30

  test-macos:
    name: Test (macOS)
    runs-on: eph-macos-arm64
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: test-logs/
          retention-days: 30

  charter-matrix:
    name: Charter (${{ matrix.mm }}/${{ matrix.mode }}/threads:${{ matrix.threads }}) (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
        mm: [arc, orc, refc]
        mode: [debug, release]
        threads: [on, off]
    runs-on: ${{ matrix.runner }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: dev-exec just _matrix ${{ matrix.mm }} ${{ matrix.mode }} ${{ matrix.threads }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charter-${{ matrix.mm }}-${{ matrix.mode }}-${{ matrix.threads }}-${{ matrix.runner }}-logs
          path: test-logs/
          retention-days: 30

  nix-build:
    name: nix build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests) is
      # private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an installation
      # token from the org's CI Token Provider app instead. The app id is an ORG
      # VARIABLE and only the private key is a secret -- `secrets.
      # CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
      - run: nix build .#default

  # Android device lane. `tests/test_android_launcher_device_only.nim` and
  # `tests/test_android_launcher_element_tree.nim` hard-fail (deliberately,
  # never skip) when `adb devices` reports no device. They are not weakened
  # and not deleted -- they run here, on a runner that DECLARES an attached
  # device through the `ANDROID_DEVICE_RUNNER` repository variable, so the
  # failure the authors asked for fires where a device is actually expected.
  #
  # With the variable unset the job does not exist. That is a statement about
  # the fleet, not about the test: nothing in the org currently registers a
  # runner with an emulator or handset attached, and pinning the job to a
  # label with zero runners would queue to the 24h ceiling rather than report
  # anything. Set the variable to that runner's label to turn the lane on.
  android-device:
    name: Test (Android device)
    if: ${{ vars.ANDROID_DEVICE_RUNNER != '' }}
    runs-on: ${{ vars.ANDROID_DEVICE_RUNNER }}
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - run: dev-exec just test-android-device

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-logs
          path: test-logs/
          retention-days: 30
